<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e3b28">
<script>window.DZ_NATIVE=!!(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform())||/[?&]native/.test(location.search);document.documentElement.classList.toggle("native",window.DZ_NATIVE);</script>
<script src="firebase-config.js"></script>
<title>DZ CLEAN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* DZ CLEAN: one green visual world taken from the founders' mockups. Phone app beside the municipality dashboard. */
  --ink:#10251b; --ink2:#4b6357; --line:#dde7e1; --bg:#eef3f0; --card:#ffffff;
  --g9:#0e3b28; --g7:#17704a; --g5:#2c9a63; --g1:#e3f3ea;
  --amber:#e9a92b; --red:#d14b44; --blue:#2d78c8; --violet:#7a5bc6;
  --display:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* top bar */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 20px;background:var(--g9);color:#fff;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:.5px}
.brand small{font-family:var(--body);font-weight:400;font-size:13px;opacity:.75}
.seg{display:flex;background:rgba(255,255,255,.1);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;color:#fff;padding:6px 14px;border-radius:999px;font-size:13px}
.seg button[aria-pressed="true"]{background:#fff;color:var(--g9);font-weight:600}
.demo-tag{font-size:12px;background:var(--amber);color:#3a2a00;padding:3px 10px;border-radius:999px;font-weight:600}

/* stage */
.stage{display:grid;gap:24px;padding:24px;justify-content:center;align-items:start}
.stage.split{grid-template-columns:390px minmax(0,1fr);max-width:1500px;margin:0 auto}
.stage.app{grid-template-columns:390px}
.stage.dashboard{grid-template-columns:minmax(0,1200px)}
.stage.app .dash,.stage.dashboard .phone-wrap{display:none}
@media (max-width:1060px){.stage.split{grid-template-columns:390px}.stage.split .dash{display:none}}
@media (max-width:440px){.stage{padding:0}.stage.split,.stage.app{grid-template-columns:100%}.phone{border-radius:0!important;border:0!important;height:calc(100dvh - 58px)!important}.phone-caption{display:none}}

/* phone */
.phone-wrap{position:sticky;top:16px}
.phone{position:relative;width:100%;height:780px;background:#f7faf8;border:10px solid #13261c;border-radius:42px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 30px 60px -30px rgba(14,59,40,.45)}
.phone-caption{text-align:center;font-size:12.5px;color:var(--ink2);margin-top:10px}
.statusbar{display:flex;justify-content:space-between;padding:8px 22px 4px;font-size:12px;font-weight:600;color:var(--ink)}
.screen{flex:1;overflow-y:auto;overflow-x:hidden;position:relative}
.screen::-webkit-scrollbar{width:0}
.pad{padding:14px 18px 24px}
.appbar{display:flex;align-items:center;gap:10px;padding:10px 16px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.appbar h2{font-size:17px;flex:1;text-align:center}
.iconbtn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;flex:none}
.iconbtn svg{width:20px;height:20px}
.spacer{width:38px;flex:none}

/* nav */
.nav{display:grid;grid-template-columns:repeat(5,1fr);align-items:end;background:#fff;border-top:1px solid var(--line);padding:6px 6px 10px;position:relative}
.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--ink2);padding:4px 0;position:relative}
.nav button svg{width:22px;height:22px}
.nav button[aria-current="page"]{color:var(--g7);font-weight:600}
.nav .fab{transform:translateY(-14px)}
.nav .fab span.circle{width:58px;height:58px;border-radius:50%;background:var(--g7);color:#fff;display:grid;place-items:center;box-shadow:0 8px 18px -6px rgba(23,112,74,.7);border:4px solid #f7faf8}
.nav .fab svg{width:26px;height:26px}
.badge{position:absolute;top:0;inset-inline-end:18%;background:var(--red);color:#fff;font-size:10px;min-width:17px;height:17px;border-radius:9px;display:grid;place-items:center;padding:0 4px}

/* common */
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.muted{color:var(--ink2);font-size:13px}
.btn{border:0;border-radius:14px;padding:13px 16px;font-weight:600;font-size:15px;width:100%;background:var(--g7);color:#fff;font-family:var(--display)}
a.btn{display:block;text-align:center;text-decoration:none}
a.glink{color:var(--blue);font-size:12px;text-decoration:none;white-space:nowrap;display:inline-flex;align-items:center;gap:3px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:#fff;color:var(--g7);border:1.5px solid var(--g7)}
.btn.small{width:auto;padding:8px 14px;font-size:13px;border-radius:10px}
.btn.light{background:var(--g1);color:var(--g9)}
.btn.danger{background:var(--red)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:3px 10px;border-radius:999px;background:var(--g1);color:var(--g9);font-weight:600;white-space:nowrap}
.chip.new{background:#fde8e6;color:#9b2c25}
.chip.prog{background:#fff2d6;color:#7a5200}
.chip.done{background:var(--g1);color:var(--g9)}
.stack{display:grid;gap:12px}
.label{font-size:13px;font-weight:600;margin-bottom:6px;display:block}
.field{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;background:#fff}
.field:focus{border-color:var(--g5);outline:none}
.section-title{font-size:15px;font-weight:700;font-family:var(--display);margin:18px 0 10px}

/* onboarding */
.onb{display:flex;flex-direction:column;height:100%}
.onb-art{height:52%;position:relative;background:linear-gradient(#bfe6f2,#e9f7fb 55%,#f7faf8)}
.onb-art svg{position:absolute;inset:0;width:100%;height:100%}
.onb-body{flex:1;display:flex;flex-direction:column;gap:12px;padding:6px 22px 22px;text-align:center}
.onb-body h1{font-size:34px;color:var(--g9);letter-spacing:1px}
.onb-body p{margin:0;color:var(--ink2)}
.dots{display:flex;justify-content:center;gap:6px;margin:4px 0}
.dots i{width:7px;height:7px;border-radius:4px;background:var(--line);transition:width .2s}
.dots i.on{width:20px;background:var(--g7)}

/* home */
.hello{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.hello h2{font-size:20px}
.points{background:linear-gradient(120deg,var(--g9),var(--g7));color:#fff;border-radius:18px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px}
.points b{font-size:24px;font-family:var(--display)}
.next{margin-top:12px;background:var(--g1);border-radius:18px;padding:14px 16px;display:flex;gap:12px;align-items:center;border:1px solid #c9e8d6}
.next .big{font-family:var(--display);font-size:22px;font-weight:700;color:var(--g9)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{border:1px solid var(--line);background:#fff;border-radius:16px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12.5px;font-weight:600;text-align:center;min-height:92px;justify-content:center}
.tile .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center}
.tile .ic svg{width:22px;height:22px}
.rep{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:14px;background:#fff}
.rep img,.rep .ph{width:48px;height:48px;border-radius:10px;object-fit:cover;background:var(--g1);flex:none}
.rep .t{font-weight:600;font-size:13.5px}

/* types */
.types{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.type{border-radius:16px;padding:14px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;border:1px solid transparent;text-align:center}
.type svg{width:34px;height:34px}
.type b{font-size:14px}
.type span{font-size:11.5px;color:var(--ink2)}

/* report */
.steps{display:flex;justify-content:center;align-items:center;gap:0;margin:6px 0 14px}
.steps i{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:700;background:var(--line);color:var(--ink2);font-size:13px}
.steps i.on{background:var(--g7);color:#fff}
.steps b{width:44px;height:2px;background:var(--line)}
.opt{display:flex;gap:12px;align-items:center;border:1.5px solid var(--line);border-radius:16px;padding:12px;background:#fff;text-align:start;width:100%}
.opt[aria-pressed="true"]{border-color:var(--g7);background:var(--g1)}
.opt .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none}
.opt .ic svg{width:24px;height:24px}
.drop{border:2px dashed #a9d3bb;border-radius:16px;min-height:150px;display:grid;place-items:center;background:#f2faf5;text-align:center;padding:12px;position:relative;overflow:hidden}
.drop img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.toggle{width:46px;height:26px;border-radius:13px;background:var(--line);position:relative;border:0;flex:none}
.toggle::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:inset-inline-start .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle[aria-checked="true"]{background:var(--g5)}
.toggle[aria-checked="true"]::after{inset-inline-start:23px}
.map{width:100%;border-radius:16px;border:1px solid var(--line);display:block;background:#eaf1ec;touch-action:manipulation}
.success{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding-top:20px}
.check{width:92px;height:92px;border-radius:50%;background:var(--g1);display:grid;place-items:center;animation:pop .5s ease-out}
.check svg{width:46px;height:46px;color:var(--g7)}
@keyframes pop{0%{transform:scale(.5);opacity:.2}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.kv{display:grid;gap:0;width:100%;text-align:start}
.kv div{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);gap:10px}
.kv div span:first-child{color:var(--ink2);font-size:13px}
.kv div span:last-child{font-weight:600}
.timeline{display:grid;gap:0;margin-top:6px}
.timeline div{display:flex;gap:10px;align-items:flex-start;padding-bottom:12px;position:relative}
.timeline div::before{content:"";position:absolute;top:18px;bottom:0;inset-inline-start:8px;width:2px;background:var(--line)}
.timeline div:last-child::before{display:none}
.timeline i{width:18px;height:18px;border-radius:50%;background:var(--line);flex:none;margin-top:2px;z-index:1}
.timeline i.on{background:var(--g5)}

/* schedule */
.day{display:flex;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.day:last-child{border-bottom:0}
.day .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none}
.day .ic svg{width:22px;height:22px}
.today{outline:2px solid var(--g5);outline-offset:-2px;border-radius:12px;background:#f2faf5}

/* sheet & toast */
.sheet-bg{position:absolute;inset:0;background:rgba(14,40,28,.4);z-index:20;display:flex;align-items:flex-end}
.sheet{background:#fff;width:100%;border-radius:22px 22px 0 0;padding:18px;max-height:85%;overflow:auto;animation:up .25s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.toast{position:absolute;top:44px;inset-inline:14px;z-index:30;background:var(--g9);color:#fff;border-radius:14px;padding:12px 14px;font-size:13.5px;box-shadow:0 10px 24px -10px rgba(0,0,0,.5);animation:up .25s ease-out;display:flex;gap:10px;align-items:center}
.toast svg{width:20px;height:20px;flex:none;color:var(--amber)}

/* dashboard */
.dash{background:#fff;border:1px solid var(--line);border-radius:22px;overflow:hidden;min-width:0}
.dash-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.dash-head h2{font-size:19px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;padding:16px 20px}
.kpi{border:1px solid var(--line);border-radius:16px;padding:12px 14px;position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:4px;background:var(--g5)}
.kpi.warn::before{background:var(--amber)}.kpi.bad::before{background:var(--red)}
.kpi b{display:block;font-size:26px;font-family:var(--display)}
.kpi span{font-size:12.5px;color:var(--ink2)}
.dash-body{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px;padding:0 20px 20px}
@media (max-width:1300px){.dash-body{grid-template-columns:minmax(0,1fr)}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.panel{border:1px solid var(--line);border-radius:16px;padding:14px;min-width:0}
.panel h3{font-size:15px;margin-bottom:10px}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:start;font-weight:600;color:var(--ink2);font-size:12px;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
td.num,td .btn{white-space:nowrap}
tr.fresh td{animation:flash 2s ease-out}
@keyframes flash{from{background:#fff2d6}to{background:transparent}}
td img,td .ph{width:38px;height:38px;border-radius:8px;object-fit:cover;background:var(--g1);display:block}
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:110px 1fr 28px;align-items:center;gap:8px;font-size:12.5px}
.bar i{display:block;height:12px;border-radius:6px;background:linear-gradient(90deg,var(--g5),var(--g7))}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:50%;display:inline-block}
.truckrow{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px;gap:8px}
.truckrow:last-child{border-bottom:0}
.broadcast{display:flex;gap:8px;margin-top:8px}
.broadcast input{flex:1;min-width:0}

/* live tracking */
.trk{position:relative;height:100%;min-height:520px;overflow:hidden;background:#f1efe9}
#tmap{position:absolute;inset:0;width:100%;height:100%;display:block}
.trk-top{position:absolute;top:10px;inset-inline:12px;display:flex;align-items:center;gap:8px;z-index:3}
.fbtn{width:42px;height:42px;border-radius:50%;background:#fff;border:0;box-shadow:0 4px 14px -5px rgba(0,0,0,.35);display:grid;place-items:center;color:var(--ink);flex:none}
.fbtn svg{width:20px;height:20px}
.fbtn.on{background:var(--g7);color:#fff}
.trk-pills{display:flex;gap:6px;flex:1;justify-content:center}
.tpill{border:0;background:#fff;border-radius:999px;padding:7px 11px;display:flex;gap:5px;align-items:center;font-weight:700;font-size:13px;box-shadow:0 4px 14px -5px rgba(0,0,0,.35)}
.tpill[aria-pressed="true"]{background:var(--g9);color:#fff}
.live{background:#fff;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:700;color:var(--red);display:flex;align-items:center;gap:6px;box-shadow:0 4px 14px -5px rgba(0,0,0,.35);flex:none}
.live i{width:8px;height:8px;border-radius:50%;background:var(--red);animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.25}}
.trk-side{position:absolute;inset-inline-end:12px;top:70px;display:grid;gap:8px;z-index:3}
.trk-sheet{position:absolute;bottom:0;inset-inline:0;background:#fff;border-radius:22px 22px 0 0;padding:8px 16px 14px;box-shadow:0 -12px 30px -14px rgba(0,0,0,.35);z-index:3;display:grid;gap:10px}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);justify-self:center}
.eta{font-family:var(--display);font-size:25px;font-weight:700;color:var(--g9);line-height:1.2}
.eta-box{background:var(--g1);border-radius:14px;padding:6px 14px;text-align:center;display:grid;flex:none}
.eta-box b{font-size:19px;font-family:var(--display);color:var(--g9)}
.tprog{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.tprog i{display:block;height:100%;background:linear-gradient(90deg,var(--g5),var(--g7));width:0;transition:width .3s}
.driver{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:8px 10px}
.av{width:40px;height:40px;border-radius:50%;background:var(--g9);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.plate{border:2px solid var(--ink);border-radius:6px;padding:2px 6px;font-weight:700;font-size:12.5px;background:#fff;white-space:nowrap}
.trk-actions{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.act{border:0;background:var(--bg);border-radius:14px;padding:8px 2px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--ink);text-decoration:none;text-align:center}
.act svg{width:20px;height:20px;color:var(--g7)}
.act.on{background:var(--g7);color:#fff}
.act.on svg{color:#fff}
.arrive{background:#fff2d6;color:#6b4a00;border-radius:12px;padding:8px 10px;display:flex;gap:8px;align-items:center;font-weight:600;font-size:13px}
[hidden]{display:none!important}
.pulse{animation:pulse 1.8s ease-out infinite}
@keyframes pulse{0%{r:12;opacity:.45}100%{r:34;opacity:0}}

/* v4: accounts, workers, dashboard tabs */
.chip.off{background:#eceff0;color:#5b6660}
.chip.tv{background:#efeafb;color:#4d3696}
.chip .dot,.dot{width:7px;height:7px;border-radius:50%;background:var(--g5);display:inline-block;animation:blink 1.6s infinite}
.av{width:36px;height:36px;border-radius:50%;background:#dfe7e2;color:var(--ink2);display:inline-grid;place-items:center;font-weight:700;flex:none;border:2px solid #fff;box-shadow:0 0 0 2px #dfe7e2}
.av.on{background:#dbe9f8;color:#1d3f6b;box-shadow:0 0 0 2px var(--blue)}
.av.break{background:#fff2d6;color:#7a5200;box-shadow:0 0 0 2px var(--amber)}
.av.sm{width:28px;height:28px;font-size:12px}
.av.lg{width:64px;height:64px;font-size:26px;background:var(--g1);color:var(--g7);box-shadow:none}
.avs{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:8px}
.teamcard{display:block;width:100%;text-align:start;margin-top:12px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px 14px}
.stat{text-align:center;padding:10px 6px}
.stat b{display:block;font-size:19px;font-family:var(--display)}
.stat span{font-size:11.5px;color:var(--ink2)}
.stars i{font-style:normal;color:#d5dbd7;font-size:14px}
.stars i.on{color:var(--amber)}
.starpick{display:flex;gap:6px;justify-content:center;direction:ltr}
.starpick button{border:0;background:none;font-size:32px;color:#d5dbd7;line-height:1;padding:0 2px}
.starpick button.on{color:var(--amber)}
.demo-acc{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:start;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:8px 10px;margin-top:6px}
.shift{margin-top:12px;border-radius:18px;padding:14px 16px;color:#fff;background:linear-gradient(120deg,#4b5a53,#6d7a73)}
.shift.on{background:linear-gradient(120deg,var(--g9),var(--g7))}
.shift.break{background:linear-gradient(120deg,#8a5d00,#c68a12)}
.shift b{font-size:24px;font-family:var(--display)}

function simShift(a){
 const d=now(),h=d.getHours()+d.getMinutes()/60;
 const w=a.sim==='am'?{s:6,e:14,bs:10,be:10.5}:{s:16,e:24,bs:20,be:20.5};
 const start=new Date(d);start.setHours(w.s,0,0,0);
 const p=hoodXY(a.hood);
 if(h<w.s)return {status:'off',startedAt:null,workedMs:0,x:p[0],y:p[1],sim:true,win:w};
 if(h>=w.e)return {status:'off',startedAt:start.getTime(),endedAt:start.getTime()+(w.e-w.s)*3600000,workedMs:(w.e-w.s-0.5)*3600000,x:p[0],y:p[1],sim:true,win:w};
 const brk=h>=w.bs&&h<w.be;
 const worked=Date.now()-start.getTime()-(h>=w.be?1800000:0)-(brk?(h-w.bs)*3600000:0);
 return {status:brk?'break':'on',startedAt:start.getTime(),workedMs:worked,x:p[0],y:p[1],sim:true,win:w};
}

 const a=D.accounts[phone];if(!a)return {status:'off',workedMs:0};

 if(sh&&sh.day===DAY())return sh;

}

let rotA=0,lastAlertPass=-1;
function updateTrack(){
 const svg=document.getElementById('tmap');if(!svg)return;
 const T=TRUCKS[S.trackId];const f=((frac()+T.off)%1+1)%1;const p=along(f);
 /* smooth heading */
 let target=p[2]*180/Math.PI;let d=((target-rotA+540)%360)-180;rotA+=d*0.18;
 const tr=document.getElementById('t-truck');if(tr)tr.setAttribute('transform','translate('+p[0].toFixed(2)+' '+p[1].toFixed(2)+')');
 const rot=document.getElementById('t-rot');if(rot)rot.setAttribute('transform','rotate('+rotA.toFixed(1)+')');
 /* remaining path to my stop */
 const st=myStop();let df=st.d-f;if(df<0)df+=1;
 const pts=[];const n=Math.max(2,Math.ceil(df/0.004));for(let i=0;i<=n;i++){const q=along(f+df*i/n);pts.push(q[0].toFixed(1)+','+q[1].toFixed(1));}
 const ptsS=pts.join(' ');['t-remain','t-remain-case'].forEach(id=>{const el=document.getElementById(id);if(el)el.setAttribute('points',ptsS);});
 /* camera */
 const W=400/S.zoom,Hh=W*1.62;let cx,cy;
 if(S.follow){cx=p[0];cy=p[1]+Hh*0.17;}else{cx=200;cy=190;}
 svg.setAttribute('viewBox',(cx-W/2).toFixed(1)+' '+(cy-Hh/2).toFixed(1)+' '+W.toFixed(1)+' '+Hh.toFixed(1));
 /* sheet */
 const mins=df*LOOP_SEC; /* 1 s of demo = 1 min of service */
 const set=(id,v)=>{const el=document.getElementById(id);if(el&&el.textContent!==v)el.textContent=v;};
 const arrived=mins<1.5;
 set('t-eta',arrived?'وصلت':'تصل بعد '+Math.max(1,Math.round(mins))+' د');
 set('t-at',hm(new Date(Date.now()+mins*60000)));
 set('t-status',arrived?'الشاحنة '+S.trackId+' في '+st.n:'الشاحنة '+S.trackId+' في الطريق إلى '+st.n);
 set('t-dist','المسافة المتبقية '+(df*ROUTE_LEN*0.01).toFixed(1)+' كم');
 const up=STOPS.map(x=>{let dd=x.d-f;if(dd<0)dd+=1;return {n:x.n,dd};}).sort((a,b)=>a.dd-b.dd)[0];
 set('t-next','المحطة التالية: '+up.n);
 const bar=document.getElementById('t-bar');if(bar)bar.style.width=Math.round((1-df)*100)+'%';
 const ar=document.getElementById('t-arrive');if(ar)ar.hidden=!arrived;
 const tg=document.getElementById('truck-gmaps');if(tg)tg.href=gmaps(p[0],p[1]);
 const pass=Math.floor(frac()+T.off-st.d+1);
 if(S.alert5&&mins<=5&&mins>1.5&&lastAlertPass!==pass){lastAlertPass=pass;toast('الشاحنة '+S.trackId+' تصل إلى '+st.n+' بعد 5 دقائق','truck');}
}

  const p=hoodXY(w.hood);const id=uid('T');await put('tasks',id,{id,title,hood:w.hood,x:p[0]+(Math.random()*40-20),y:p[1]+(Math.random()*24-6),assignee:w.phone,status:'todo',prio:f.tp||'عادية',createdAt:Date.now(),by:S.dashMe});
  notify(w.phone,'مهمة جديدة'+(f.tp==='عاجلة'?' عاجلة':''),title+' • '+w.hood,'task');S.form.tt='';renderDash();toast('أُسندت المهمة إلى '+w.name,'check');},
 async dnewworker(){setForm(['nwname','nwphone','nwhood','nwpass']);const f=S.form;const ph=normPhone(f.nwphone);const n=String(f.nwname||'').trim();
  if(n.length<3)return toast('اكتب الاسم الكامل للعامل.','alert');if(!/^0[5-7]\d{8}$/.test(ph))return toast('رقم الهاتف 10 أرقام ويبدأ بـ 05 أو 06 أو 07.','alert');if(D.accounts[ph])return toast('هذا الرقم مسجّل مسبقاً.','alert');if(String(f.nwpass||'').length<4)return toast('كلمة السر المؤقتة 4 أحرف على الأقل.','alert');
  await put('accounts',ph,{phone:ph,name:n,role:'worker',hood:f.nwhood||HOODS[0].n,points:0,createdAt:Date.now(),pass:await hpass(ph,f.nwpass)});
  notify(ph,'مرحباً بك في فريق النظافة',(f.nwhood||HOODS[0].n)+' • غيّر كلمة السر المؤقتة من ملفك','users');
  S.form.nwname='';S.form.nwphone='';renderDash();toast('أُنشئ حساب '+n+'. يدخل برقم '+ph+' وكلمة السر المؤقتة.','check');},
 dbroadcast(){setForm(['bmsg','btarget']);const msg=String(S.form.bmsg||'').trim();if(!msg){const el=document.getElementById('f-bmsg');if(el)el.focus();return;}const tg=S.form.btarget||'all';notify(tg,'إشعار من بلدية جيجل',msg,'bell');S.form.bmsg='';renderDash();toast('أُرسل الإشعار.','send');},
 pick(a){S.trackId=a.getAttribute('data-k');S.follow=true;renderApp();},
 zoom(a){S.zoom=Math.max(0.8,Math.min(3.2,S.zoom*(a.getAttribute('data-z')==='1'?1.35:1/1.35)));},
 follow(){S.follow=!S.follow;const b=document.getElementById('t-follow');if(b)b.classList.toggle('on',S.follow);},
 alert5(a){S.alert5=!S.alert5;a.classList.toggle('on',S.alert5);a.setAttribute('aria-pressed',String(S.alert5));toast(S.alert5?'سننبّهك قبل وصول الشاحنة بـ 5 دقائق':'أُلغي التنبيه','bell');},
 callsvc(){S.sheet='<h3 style="font-size:18px;margin-bottom:6px">مصلحة النظافة – بلدية جيجل</h3><p class="muted" style="margin:0 0 12px">لحماية خصوصية السائقين والعمال، يكون الاتصال عبر المصلحة.</p><div class="card num" dir="ltr" style="font-size:22px;font-weight:700;text-align:center;color:var(--g7)">034 00 00 00</div><p class="muted" style="margin:8px 0 12px;font-size:12px">رقم تجريبي يُستبدل بالرقم الحقيقي للمصلحة.</p><button class="btn" data-act="closesheet2">إغلاق</button>';renderOverlay();},
 sharetrk(){const t='تتبع شاحنة النظافة '+S.trackId+' في '+myStop().n+' عبر تطبيق DZ CLEAN';try{navigator.clipboard.writeText(t).then(()=>toast('نُسخت رسالة التتبع، الصقها في محادثة','send'),()=>toast('لم تُنسخ الرسالة في هذا المتصفح.','alert'));}catch(_){toast('لم تُنسخ الرسالة في هذا المتصفح.','alert');}}
};
function demoAfter(){const svg='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120"><rect width="160" height="120" fill="#bcd9c3"/><rect y="78" width="160" height="42" fill="#8a8d88"/><rect x="18" y="30" width="44" height="52" rx="4" fill="#2f6b45"/><rect x="66" y="34" width="40" height="48" rx="4" fill="#2a5f3d"/><circle cx="134" cy="26" r="12" fill="#ffd66b"/><path d="M110 98l8 8 18-18" stroke="#fff" stroke-width="5" fill="none"/></svg>';return 'data:image/svg+xml;utf8,'+encodeURIComponent(svg);}
function saveDesc(){const d=document.getElementById('f-desc');if(d&&S.draft)S.draft.desc=d.value;}
document.addEventListener('change',e=>{
 const t=e.target;
 if(t.matches('input[type=file][data-photo]')&&t.files&&t.files[0]){const key=t.getAttribute('data-photo');const f=t.files[0];if(!/^image\//.test(f.type))return toast('اختر ملف صورة.','alert');const rd=new FileReader();rd.onload=()=>{const img=new Image();img.onload=()=>{const c=document.createElement('canvas');const sc=Math.min(1,480/img.width);c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext('2d').drawImage(img,0,0,c.width,c.height);const url=c.toDataURL('image/jpeg',.62);if(key==='draft'){saveDesc();S.draft.photo=url;}else S.form[key]=url;renderApp();};img.src=rd.result;};rd.readAsDataURL(f);return;}
 if(t.id==='f-sched'){S.schedHood=t.value;renderApp();return;}
 if(t.matches('[data-assign]')&&t.value){const r=D.reports[t.getAttribute('data-assign')];if(r)assignReport(r,t.value).then(()=>toast('أُسند البلاغ '+r.id,'check'));return;}
 const k=t.getAttribute('data-f');if(k){S.form[k]=t.type==='checkbox'?t.checked:t.value;if(['teamhood','rfilter','whood'].includes(k)){if(k==='teamhood')S.form.rstars=null,S.form.rcomment=null;t.blur();render();}}
});
document.addEventListener('input',e=>{
 const t=e.target;
 if(t.id==='f-desc'&&S.draft){S.draft.desc=t.value;const c=document.getElementById('desc-count');if(c)c.textContent=t.value.length+'/250';return;}
 const k=t.getAttribute('data-f');if(k&&t.type!=='checkbox')S.form[k]=t.value;
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.sheet){S.sheet=null;renderOverlay();}if(e.key==='Enter'&&e.target.matches('#f-lpass,#f-lphone'))ACTIONS.login();if(e.key==='Enter'&&e.target.matches('#f-dpass,#f-dphone'))ACTIONS.dlogin();});

/* ---------- views ---------- */
function setView(v){if(!['split','app','dashboard'].includes(v))v='split';S.view=v;document.getElementById('stage').className='stage '+v;['split','app','dashboard'].forEach(k=>{const b=document.querySelector('[data-view="'+k+'"]');if(b)b.setAttribute('aria-pressed',String(k===v));});if(location.hash!=='#'+v){try{history.replaceState(null,'','#'+v);}catch(_){}}}
window.addEventListener('hashchange',()=>setView(location.hash.slice(1)));
setView(window.DZ_NATIVE?'app':(location.hash.slice(1)||'split'));
if(window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.App){window.Capacitor.Plugins.App.addListener('backButton',()=>{if(S.sheet){S.sheet=null;renderOverlay();}else if(S.view==='dashboard'&&window.DZ_NATIVE){setView('app');}else if(S.back.length){goBack();}else{window.Capacitor.Plugins.App.exitApp();}});}
boot();
})();

</script>
</body>
