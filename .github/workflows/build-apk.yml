name: Build DZ CLEAN APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install packages
        run: npm install

      - name: Draw app icon
        continue-on-error: true
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq librsvg2-bin
          mkdir -p assets
          cat > icon.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
          <rect width="1024" height="1024" fill="#0e3b28"/>
          <circle cx="512" cy="512" r="330" fill="#1f8a55"/>
          <path d="M512 250 C700 330 740 560 600 720 C560 765 520 780 512 780 C504 780 464 765 424 720 C284 560 324 330 512 250 Z" fill="#ffffff"/>
          <path d="M512 330 L512 760" stroke="#1f8a55" stroke-width="26" stroke-linecap="round"/>
          <path d="M512 470 L600 400 M512 590 L420 520" stroke="#1f8a55" stroke-width="22" stroke-linecap="round"/>
          </svg>
          SVG
          sed -i 's/^          //' icon.svg
          rsvg-convert -w 1024 -h 1024 icon.svg -o assets/icon-only.png
          ls -la assets

      - name: Create Android project
        run: npx cap add android

      - name: App icon and splash screen
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#0e3b28' --splashBackgroundColor '#0e3b28' || echo "icon step skipped"

      - name: Camera permission (photos for reports)
        run: |
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.CAMERA" />#' android/app/src/main/AndroidManifest.xml
          grep -n "permission" android/app/src/main/AndroidManifest.xml

      - name: Copy web app into Android
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../DZ-CLEAN.apk

      - name: Keep the APK as a build file
        uses: actions/upload-artifact@v4
        with:
          name: DZ-CLEAN-apk
          path: DZ-CLEAN.apk

      - name: Publish the APK on the Releases page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: DZ CLEAN – نسخة ${{ github.run_number }}
          body: حمّل الملف DZ-CLEAN.apk وثبّته على هاتف أندرويد.
          files: DZ-CLEAN.apk
